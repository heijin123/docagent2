[project]
name = "enterprise-qa-agent"
version = "0.1.0"
description = "企业级智能问答 Agent — M1 摄取 / M2 混合检索(RRF+时效年份) / M3 LangGraph 多 Agent / M4 FastAPI+SSE"
requires-python = ">=3.13,<3.14"
dependencies = [
    "chromadb>=1.5.9",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "openai>=3.8.0",
    "rank-bm25>=0.2.2",
    "jieba>=0.42.1",
    "langgraph>=1.2.11",
    "markitdown[pdf]>=0.1.7",
    "langgraph-checkpoint-redis>=0.5,<1",
    "redis>=5.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.uv]
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"
link-mode = "copy"

[tool.pytest.ini_options]
testpaths = ["tests"]
