# Enterprise-QA-Agent 编排（M5）：app + Redis（checkpointer 跨会话记忆）
# 用法：`docker compose up -d --build`
services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # 从宿主机 .env 取值做 ${VAR:-默认} 替换。注意：这不是"全量透传"——
      # 只有下面登记的变量才会进容器，未登记者容器内一律用应用默认值。
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-dashscope}
      QWEN_EMBEDDING_MODEL: ${QWEN_EMBEDDING_MODEL:-text-embedding-v3}
      EMBED_DIMENSIONS: ${EMBED_DIMENSIONS:-1024}
      QWEN_LLM_MODEL: ${QWEN_LLM_MODEL:-qwen-plus}
      # LLM 输出约束 / 思考模式 / 超时：**必须在白名单登记**，否则容器内只能用应用默认值
      # （此前 HTTP_READ_TIMEOUT_S / LLM_MAX_RETRIES 就漏登记 → 代码里的默认值在 compose 下改不动）
      ANSWER_MAX_TOKENS: ${ANSWER_MAX_TOKENS:-512}
      LLM_ENABLE_THINKING: ${LLM_ENABLE_THINKING:-0}
      HTTP_READ_TIMEOUT_S: ${HTTP_READ_TIMEOUT_S:-120}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-0}
      SERVICE_API_KEY: ${SERVICE_API_KEY:-}
      DEFAULT_TENANT_ID: ${DEFAULT_TENANT_ID:-tenant_demo}
      # 主题锚点词表路径（留空 = 用默认 ./data/kb_anchors.json）
      KB_ANCHORS_PATH: ${KB_ANCHORS_PATH:-}
      # 服务限额（M4）：白名单式注入——新增配置项需在此登记，否则容器内用默认值
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
      API_MAX_INFLIGHT: ${API_MAX_INFLIGHT:-50}
      INGEST_WORKERS: ${INGEST_WORKERS:-1}
      # checkpointer：指向 redis 服务；不可达自动降级内存（不阻塞启动）
      REDIS_URL: redis://redis:6379/0
      REDIS_CHECKPOINTER_ENABLED: ${REDIS_CHECKPOINTER_ENABLED:-1}
      # 观测
      LOG_FORMAT: ${LOG_FORMAT:-json}
    volumes:
      - ./data:/app/data          # 向量库/BM25/registry/上传/日志 持久化
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # 与 Dockerfile HEALTHCHECK 语义一致：2xx=健康，503=degraded（核心依赖挂）也算存活，
      # 不能因 5xx 就判死（curl -f 遇 5xx 返回非 0，故单独把 503 捞出来当通过）。
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/v1/health || curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/v1/health | grep -q '503'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]   # AOF 持久化 checkpoint
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
